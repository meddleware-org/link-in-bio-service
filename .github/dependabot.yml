version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  # Page build tooling and browser tests (never shipped: the page's files are embedded in the binary).
  - package-ecosystem: npm
    directory: /page
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Playwright 1.65.x ships a Firefox build that crashes pages when getByRole/getByLabel follow an axe scan
      # (microsoft/playwright#43967, #44135; fixed in Firefox r1575, not in a 1.65 release). Remove with the 1.66 move.
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
    groups:
      page-npm:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

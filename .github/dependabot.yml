# Dependabot: weekly update pull requests for each package ecosystem this repository uses. Each ecosystem groups its
# updates so one pull request covers a week's worth, and none opens more than five at a time.
version: 2
updates:
  # The Rust workspace (Cargo.lock at the root). Minor and patch updates arrive together; majors arrive one by one,
  # because each may need code changes.
  - package-ecosystem: cargo
    directory: /
    # Checked once a week; at most five open update pull requests at a time (the same for each ecosystem below).
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  # Page build tooling and browser tests (never shipped: the page's files are embedded in the binary).
  - package-ecosystem: npm
    directory: /page
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Playwright 1.65.x ships a Firefox build that crashes pages when getByRole/getByLabel follow an axe scan
      # (microsoft/playwright#43967, #44135; fixed in Firefox r1575, not in a 1.65 release). Remove with the 1.66 move.
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
    groups:
      page-npm:
        patterns: ['*']
  # The base images in the Dockerfile (pinned by digest, so only an update pull request changes them).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ['*']
  # The actions the workflows use, which are pinned by commit hash with a version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

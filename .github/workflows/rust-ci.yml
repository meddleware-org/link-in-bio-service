name: Rust CI

# fmt, clippy, tests (the shared parser vectors and the property tests included; the store, the screening and the hosted
# service against a real PostgreSQL over TLS: scripts/test-postgres.sh), coverage, cargo-deny, the SBOM gate,
# MSRV; the page (vendored tokens and sprite current, stylelint, the five-browser end-to-end run with the shared
# accessibility sweep at AAA, Lighthouse); and the image (configuration scan, licence notices, build, vulnerability
# scan, smoke test).

on:
  push:
    branches: ["main"]
  pull_request:
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: fmt, clippy, test, coverage, cargo-deny, SBOM gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Start PostgreSQL (TLS)
        run: bash scripts/test-postgres.sh start

      # Nothing may be ignored or skipped.
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log
          if grep -E '[1-9][0-9]* ignored' test.log; then echo "::error::a test was ignored"; exit 1; fi
          if grep -E 'SKIPPED' test.log; then echo "::error::a database test was skipped"; exit 1; fi
          echo "tests run: $(grep -E '^test result' test.log | awk '{ n += $4 } END { print n }')"

      - name: Install cargo-llvm-cov and cargo-cyclonedx
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-cyclonedx@0.5.9

      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage.txt
          { echo '### Line coverage'; echo '```'; tail -n 3 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

      - name: SBOM gate (tests, then the real SBOM)
        run: |
          bash scripts/tests/check-sbom-test.sh
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json --spec-version 1.5 \
            --no-build-deps --target x86_64-unknown-linux-gnu -q
          bash scripts/check-sbom.sh crates/cli/link-in-bio.cdx.json link-in-bio

      - name: Index gate tests
        run: bash scripts/tests/check-index-test.sh

      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/test-postgres.sh stop

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the declared minimum toolchain
        run: rustup toolchain install 1.94 --profile minimal --no-self-update && rustup default 1.94
      - name: Start PostgreSQL (TLS)
        run: bash scripts/test-postgres.sh start
      - name: Test on the declared minimum toolchain
        run: cargo test --locked --workspace
      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/test-postgres.sh stop

  page:
    name: Page (vendored files, stylelint, the binary, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: page/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit gate
        run: npx mw-audit-gate

      - name: Vendored tokens, brand icons and sprite are current
        run: npm run check:vendored

      - name: Stylelint
        run: npm run lint:css

      # The binary the browser jobs serve and render with: built once here, then handed to them.
      - name: Build the binary
        run: cargo build -q -p link-in-bio

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-in-bio-bin
          path: target/debug/link-in-bio
          retention-days: 1

      - name: Lighthouse
        run: npm run lhci

  # The page's Playwright version, so the browser jobs use the image built for exactly that version.
  page-playwright:
    name: Page Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(node -p "require('./page/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # The page's browser tests (the theme matrix, WCAG 2.2 AA and AAA, reflow, keyboard): every test on all five projects, as
  # before, each project in its own job at the same time, in Playwright's image for the locked version (the same browser
  # builds and their system libraries; resolute, like the runner the binary was built on), with the page job's binary, so
  # no job installs browsers or apt packages or compiles Rust (D129).
  page-e2e:
    name: Page browser tests (${{ matrix.project }})
    needs: [page, page-playwright]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.page-playwright.outputs.version }}-resolute
      # Chromium's recommended shared-memory setting for containers.
      options: --ipc=host
    defaults:
      run:
        working-directory: page
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: page/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: link-in-bio-bin
          path: target/debug

      # Artifacts keep no file mode.
      - name: The binary is executable
        run: chmod +x ../target/debug/link-in-bio && ../target/debug/link-in-bio --version

      # A bare runner gives sans-serif, serif, monospace and system-ui to DejaVu (Ubuntu's fonts-dejavu-core 2.37), and the
      # layout checks (reflow at 320 px, 200 % text, target sizes) were written against it. Playwright's image has no DejaVu,
      # and its CJK font would take those names. So: the same release from upstream (checksum pinned), preferred for them.
      - name: The runner's fonts (DejaVu 2.37)
        run: |
          curl -fsSL -o /tmp/dejavu.tar.bz2 https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
          echo "fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7  /tmp/dejavu.tar.bz2" | sha256sum -c -
          mkdir -p /usr/share/fonts/truetype/dejavu
          python3 -c "import os, sys, tarfile; t = tarfile.open(sys.argv[1]); [open(os.path.join(sys.argv[2], os.path.basename(m.name)), 'wb').write(t.extractfile(m).read()) for m in t.getmembers() if m.name.endswith('.ttf')]" /tmp/dejavu.tar.bz2 /usr/share/fonts/truetype/dejavu
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' \
            '<match target="pattern"><test name="family"><string>sans-serif</string></test><edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit></match>' \
            '<match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit></match>' \
            '</fontconfig>' > /etc/fonts/local.conf
          fc-cache -f
          for f in sans-serif system-ui serif monospace; do fc-match "$f" | grep -q DejaVu || { echo "::error::$f is $(fc-match "$f")"; exit 1; }; done

      - name: End-to-end (AAA gate)
        env:
          E2E_BROWSERS: all
          LIB_PAGE_BIN: ../target/debug/link-in-bio
        run: HOME=/root npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: page/playwright-report
          retention-days: 7

  image:
    name: Image (configuration scan, licence notices, build, scan, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.74.0

      - name: Third-party licence notices
        run: |
          docker build --target notices --tag link-in-bio-service:notices .
          docker run --rm link-in-bio-service:notices cat /out/THIRD_PARTY_LICENSES.txt > THIRD_PARTY_LICENSES.txt
          test -s THIRD_PARTY_LICENSES.txt
          grep -q 'Apache License' THIRD_PARTY_LICENSES.txt

      - name: Build (not pushed)
        run: docker build --tag link-in-bio-service:ci .

      - name: Scan the image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: link-in-bio-service:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      - name: Smoke test
        run: bash scripts/smoke.sh link-in-bio-service:ci

name: Rust CI

# fmt, clippy, tests (the shared parser vectors and the property tests included; the store, the screening and the hosted
# service against a real PostgreSQL over TLS: scripts/test-postgres.sh), coverage, cargo-deny, the SBOM gate,
# MSRV; the page (vendored tokens and sprite current, stylelint, the five-browser end-to-end run with the shared
# accessibility sweep at AAA, Lighthouse); and the image (configuration scan, licence notices, build, vulnerability
# scan, smoke test).

# Every push to main, every pull request, and (through workflow_call) the release workflow on the tagged commit.
on:
  push:
    branches: ["main"]
  pull_request:
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

# Read-only: no job here writes to the repository, so the token is limited to reading it.
permissions:
  contents: read

# DO_NOT_TRACK asks the tools run here not to send usage data anywhere.
env:
  DO_NOT_TRACK: "1"

# Five jobs, independent of each other except that the browser jobs need the page job's binary: the Rust checks, the declared
# minimum Rust version, the page build and checks, the browser tests, and the image.
jobs:
  check:
    name: fmt, clippy, test, coverage, cargo-deny, SBOM gate
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit hash, with the version as a comment so Dependabot can update both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup ships on the runner image; using it directly leaves no third-party toolchain action to pin.
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools --no-self-update && rustup default stable

      # Cache the build between runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only save the cache on main-branch pushes, to avoid saturating the cache upload bandwidth.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Formatting is checked, never rewritten, in CI.
      - name: Format check
        run: cargo fmt --check

      # Warnings are errors, and the missing-documentation lints are part of that.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The same script starts and stops the database in every job that needs one: a PostgreSQL with TLS, which the tests need and a
      # `services:` container cannot be given flags for. REQUIRE_TEST_DATABASE=1 (written by the script) makes a missing server a failure.
      - name: Start PostgreSQL (TLS)
        run: bash scripts/test-postgres.sh start

      # Nothing may be ignored or skipped.
      # Nothing may be ignored or skipped.
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log
          if grep -E '[1-9][0-9]* ignored' test.log; then echo "::error::a test was ignored"; exit 1; fi
          if grep -E 'SKIPPED' test.log; then echo "::error::a database test was skipped"; exit 1; fi
          echo "tests run: $(grep -E '^test result' test.log | awk '{ n += $4 } END { print n }')"

      # Coverage figure: printed to the job summary; informational, not a gate.
      - name: Install cargo-llvm-cov and cargo-cyclonedx
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-cyclonedx@0.5.9

      # Read the coverage tool's own summary and print its last lines in the job summary.
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage.txt
          { echo '### Line coverage'; echo '```'; tail -n 3 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Advisories, licences, bans and sources per deny.toml (the same RustSec database as `cargo audit`).
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      # The release attests a CycloneDX SBOM for the binary; this is the gate it must pass there too, tested first.
      - name: SBOM gate (tests, then the real SBOM)
        run: |
          bash scripts/tests/check-sbom-test.sh
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json --spec-version 1.5 \
            --no-build-deps --target x86_64-unknown-linux-gnu -q
          bash scripts/check-sbom.sh crates/cli/link-in-bio.cdx.json link-in-bio

      # The release merges the two native per-architecture images into one index; this gate (used there) is tested here.
      - name: Index gate tests
        run: bash scripts/tests/check-index-test.sh

      # Always runs, so a failed step does not leave the database container behind.
      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/test-postgres.sh stop

  # The workspace declares the oldest Rust it supports; this job proves it still builds and passes on exactly that.
  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The declared minimum, installed the same way as the stable toolchain.
      - name: Install the declared minimum toolchain
        run: rustup toolchain install 1.94 --profile minimal --no-self-update && rustup default 1.94
      # The dependency graph's floor matters at run time too: the tests run on it, against PostgreSQL.
      - name: Start PostgreSQL (TLS)
        run: bash scripts/test-postgres.sh start
      # The same tests as the stable job, on the minimum toolchain.
      - name: Test on the declared minimum toolchain
        run: cargo test --locked --workspace
      # Always stops the database, as above.
      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/test-postgres.sh stop

  # The page: the Rust service renders it, and this job checks the files it vendors, the style rules and Lighthouse, and builds the binary the
  # browser jobs use. Its commands run in page/.
  page:
    name: Page (vendored files, stylelint, the binary, Lighthouse)
    runs-on: ubuntu-latest
    # Every `run` step of this job starts in page/, where the npm project is.
    defaults:
      run:
        working-directory: page
    steps:
      # Same pinned checkout as above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The page job builds the binary too, so it needs the toolchain and the cache.
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Node 26 with npm's cache keyed on the lock file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: page/package-lock.json

      # A clean install from the lock file; no audit or funding output.
      - name: Install
        run: npm ci --no-audit --no-fund

      # The shared npm audit gate (mw-audit-gate), checked against the repository's allow-list.
      - name: Audit gate
        run: npx mw-audit-gate

      # The tokens, brand icons and sprite this service vendors must equal the pinned packages' files (npm run check:vendored).
      - name: Vendored tokens, brand icons and sprite are current
        run: npm run check:vendored

      # The page's stylesheet, linted with the fleet's rules.
      - name: Stylelint
        run: npm run lint:css

      # The binary the browser jobs serve and render with: built once here, then handed to them.
      # The binary the browser jobs serve and render with: built once here, then handed to them.
      - name: Build the binary
        run: cargo build -q -p link-in-bio

      # Hand the binary to the browser jobs; one day is enough, because they run straight after this job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-in-bio-bin
          path: target/debug/link-in-bio
          retention-days: 1

      # Lighthouse CI runs against the example page the binary serves: accessibility 100, best practices at the configured floor.
      - name: Lighthouse
        run: npm run lhci

  # The page's Playwright version, so the browser jobs use the image built for exactly that version.
  # The page's Playwright version, so the browser jobs use the image built for exactly that version.
  page-playwright:
    name: Page Playwright version
    runs-on: ubuntu-latest
    # Passed to the browser jobs, which name their container image from it.
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Same pinned checkout as above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Read the locked version from the lock file, so the image and the browsers never drift apart.
      - id: v
        run: echo "version=$(node -p "require('./page/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # The page's browser tests (the theme matrix, WCAG 2.2 AA and AAA, reflow, keyboard): every test on all five projects, as
  # before, each project in its own job at the same time, in Playwright's image for the locked version (the same browser
  # builds and their system libraries; resolute, like the runner the binary was built on), with the page job's binary, so
  # no job installs browsers or apt packages or compiles Rust (D129).
  # The page's browser tests (the theme matrix, WCAG 2.2 AA and AAA, reflow, keyboard): every test on all five projects, as
  # before, each project in its own job at the same time, in Playwright's image for the locked version (the same browser
  # builds and their system libraries; resolute, like the runner the binary was built on), with the page job's binary, so
  # no job installs browsers or apt packages or compiles Rust (D129).
  page-e2e:
    name: Page browser tests (${{ matrix.project }})
    # Wait for the binary and the version.
    needs: [page, page-playwright]
    runs-on: ubuntu-latest
    # Playwright's own image runs the job; its tag is the locked version.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.page-playwright.outputs.version }}-resolute
      # Chromium's recommended shared-memory setting for containers.
      # Chromium's recommended shared-memory setting for containers.
      options: --ipc=host
    # The npm project is in page/.
    defaults:
      run:
        working-directory: page
    # One job per browser project. A failure in one does not cancel the others, so every browser's result is visible.
    strategy:
      fail-fast: false
      matrix:
    # The five projects the fleet tests: desktop Chromium, Firefox and WebKit, and mobile Chrome and Safari.
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      # Same pinned checkout as above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26 with npm's cache keyed on the lock file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: page/package-lock.json

      # A clean install from the lock file; no audit or funding output.
      - name: Install
        run: npm ci --no-audit --no-fund

      # The binary the page job built.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: link-in-bio-bin
          path: target/debug

      # Artifacts keep no file mode.
      - name: The binary is executable
        run: chmod +x ../target/debug/link-in-bio && ../target/debug/link-in-bio --version

      # Artifacts keep no file mode.
      # A bare runner gives sans-serif, serif, monospace and system-ui to DejaVu (Ubuntu's fonts-dejavu-core 2.37), and the
      # layout checks (reflow at 320 px, 200 % text, target sizes) were written against it. Playwright's image has no DejaVu,
      # and its CJK font would take those names. So: the same release from upstream (checksum pinned), preferred for them.
      - name: The runner's fonts (DejaVu 2.37)
        run: |
          curl -fsSL -o /tmp/dejavu.tar.bz2 https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
          echo "fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7  /tmp/dejavu.tar.bz2" | sha256sum -c -
          mkdir -p /usr/share/fonts/truetype/dejavu
          python3 -c "import os, sys, tarfile; t = tarfile.open(sys.argv[1]); [open(os.path.join(sys.argv[2], os.path.basename(m.name)), 'wb').write(t.extractfile(m).read()) for m in t.getmembers() if m.name.endswith('.ttf')]" /tmp/dejavu.tar.bz2 /usr/share/fonts/truetype/dejavu
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' \
            '<match target="pattern"><test name="family"><string>sans-serif</string></test><edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit></match>' \
            '<match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit></match>' \
            '</fontconfig>' > /etc/fonts/local.conf
          fc-cache -f
          for f in sans-serif system-ui serif monospace; do fc-match "$f" | grep -q DejaVu || { echo "::error::$f is $(fc-match "$f")"; exit 1; }; done

      # E2E_BROWSERS=all runs every project's tests; LIB_PAGE_BIN names the binary, so the tests build nothing.
      - name: End-to-end (AAA gate)
        env:
          E2E_BROWSERS: all
          LIB_PAGE_BIN: ../target/debug/link-in-bio
        run: HOME=/root npx playwright test --project=${{ matrix.project }}

      # On a failure, keep the Playwright report for a week.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: page/playwright-report
          retention-days: 7

  # The container image: scanned, built, scanned again and smoke-tested, but never pushed from here (the release workflow publishes it).
  image:
    name: Image (configuration scan, licence notices, build, scan, smoke test)
    runs-on: ubuntu-latest
    steps:
      # Same pinned checkout as above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scan the repository's configuration files (the Dockerfile, the workflows) and look for committed secrets.
      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.74.0

      # The licence texts of every dependency are collected by the Dockerfile's `notices` stage; the step fails if the file is empty or lacks the Apache licence text.
      - name: Third-party licence notices
        run: |
          docker build --target notices --tag link-in-bio-service:notices .
          docker run --rm link-in-bio-service:notices cat /out/THIRD_PARTY_LICENSES.txt > THIRD_PARTY_LICENSES.txt
          test -s THIRD_PARTY_LICENSES.txt
          grep -q 'Apache License' THIRD_PARTY_LICENSES.txt

      # Build the image once; it is not pushed.
      - name: Build (not pushed)
        run: docker build --tag link-in-bio-service:ci .

      # Scan the built image for known vulnerabilities; fail on fixable critical or high ones.
      - name: Scan the image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: link-in-bio-service:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      # Run the image: read-only, no capabilities, serving the example page, then the hosted roles against a throwaway database (scripts/smoke.sh).
      - name: Smoke test
        run: bash scripts/smoke.sh link-in-bio-service:ci
